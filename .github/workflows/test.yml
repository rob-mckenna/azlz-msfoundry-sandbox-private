name: Test

on:
  push:
    branches:
      - main
      - develop
      - qa
    paths:
      - 'src/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
      - develop
      - qa
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  # =====================
  # UNIT TESTS
  # =====================
  test:
    name: Unit Tests (.NET)
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Restore dependencies
        run: |
          cd src/webapp
          dotnet restore

      - name: Build application
        run: |
          cd src/webapp
          dotnet build -c Release --no-restore

      - name: Run unit tests
        run: |
          cd src/webapp
          dotnet test -c Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/webapp/**/test-results.trx

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: src/webapp/**/test-results.trx
          check_name: .NET Unit Tests

  # =====================
  # LINTING & CODE QUALITY
  # =====================
  lint:
    name: Code Quality Checks
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Restore dependencies
        run: |
          cd src/webapp
          dotnet restore

      - name: Enforce code style in build
        run: |
          cd src/webapp
          dotnet build -c Release --no-restore /p:EnforceCodeStyleInBuild=true

      - name: Fail on vulnerable packages
        run: |
          cd src/webapp
          dotnet list package --vulnerable --include-transitive

  # =====================
  # DOCKERFILE LINTING
  # =====================
  dockerfile:
    name: Docker Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3007,DL3008

  # =====================
  # SUMMARY
  # =====================
  summary:
    name: Test Summary
    needs: [test, lint, dockerfile]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Print results
        run: |
          echo "test: ${{ needs.test.result }}"
          echo "lint: ${{ needs.lint.result }}"
          echo "dockerfile: ${{ needs.dockerfile.result }}"

      - name: Fail if any required job failed
        if: needs.test.result != 'success' || needs.lint.result != 'success' || needs.dockerfile.result != 'success'
        run: exit 1
